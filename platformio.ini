; Cell Pet: a living cell you raise, and a desk clock, for the ESP32-2432S028R
; ("Cheap Yellow Display").  Build and flash:   pio run -t upload
; Same flash layout as CYD Demoscene, so switching between the two keeps
; WiFi, the pet's save and everything else in place.

[platformio]
default_envs = cyd

[env:cyd]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
monitor_speed = 921600
upload_speed = 921600
lib_deps =
    lovyan03/LovyanGFX@^1.2.7
build_flags =
    -O2
    -DCORE_DEBUG_LEVEL=0
build_unflags = -Os
