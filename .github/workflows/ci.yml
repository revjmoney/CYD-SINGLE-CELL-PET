name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    name: Private data check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Look for home IPs, emails, tokens, keys and private project names
        run: |
          fail=0
          if git grep -n -I -E '192\.168\.1\.[0-9]+|myemail937|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|PRIVATE KEY-----' -- . ':!.github/workflows/ci.yml' ':!*.png'; then
            echo "::error::private data found (lines above)"
            fail=1
          fi
          if git grep -n -I -i -E 'rose engine|guilloche|gen-rose' -- . ':!.github/workflows/ci.yml' ':!*.png'; then
            echo "::error::private project name found (lines above)"
            fail=1
          fi
          exit $fail

  firmware:
    name: Firmware (cyd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build
        run: pio run -e cyd
      - uses: actions/upload-artifact@v7
        with:
          name: cyd-cell-pet-firmware
          path: .pio/build/cyd/*.bin
          retention-days: 30
          if-no-files-found: error

  host-tests:
    name: Host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and run the evolve tests (same as tools/test.ps1, with g++)
        run: |
          mkdir -p build
          g++ -std=c++17 -Wall -I lib/evolve -I test/host -o build/test_evolve test/host/test_evolve.cpp lib/evolve/evolve.cpp lib/evolve/quips.cpp
          ./build/test_evolve

  python:
    name: Python tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Byte-compile tools
        run: python -m compileall -q tools
